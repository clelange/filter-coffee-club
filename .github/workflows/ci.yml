name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          uv run conventional-pre-commit --strict "$RUNNER_TEMP/pr-title"
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: uv run prek run --all-files
      - run: uv run pytest --cov=app --cov-report=term-missing
      - run: pnpm --dir frontend test:unit
      - run: make types-check
      - run: make audit
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: make e2e
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and verify release containers
        run: |
          for arch in amd64 arm64; do
            image="filter-coffee-club:test-${arch}"
            docker buildx build --platform "linux/${arch}" --load \
              --build-arg FCC_APP_VERSION=v2099.01.0 -t "$image" .
            docker run --rm -i --platform "linux/${arch}" --entrypoint python "$image" - "$arch" <<'PY'
          import os
          import platform
          import sys
          from pathlib import Path

          from app.config import Settings

          assert Settings().deployed_version == "v2099.01.0"
          assert platform.machine() == {"amd64": "x86_64", "arm64": "aarch64"}[sys.argv[1]]
          assert (Path(os.environ["FCC_FRONTEND_DIR"]) / "index.html").is_file()
          PY
          done
